name: "✊ 加入《创作自由宣言》公开署名册"
description: "自愿申请成为宣言公开署名者；需要 GitHub 账号，审核通过后才会加入网站名册"
title: "[宣言署名] "
body:
  - type: markdown
    attributes:
      value: |
        谢谢你愿意一起守护创造的快乐！
        - 此 Issue 及你填写的信息会公开显示在 GitHub
        - 只有通过维护者审核后，署名才会写入 sayori.org/manifesto/ 的公开名单
        - 请不要填写真实姓名、邮箱或私人联系方式，除非你明确希望它们公开
        - 无需 GitHub 账号也可以在网站上完成**仅本地**的签署
  - type: input
    id: display-name
    attributes:
      label: "公开展示的创作者昵称"
      description: "只填写你愿意公开的名称，建议 2～32 字"
      placeholder: "例如：一只热爱创作的小猫"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "想留下一句话吗？（可选）"
      description: "这段话仅保留在公开 Issue 中，不会自动同步到宣言名册"
      placeholder: "我创造，因为我想创造"
    validations:
      required: false
  - type: checkboxes
    id: agreement
    attributes:
      label: "公开署名确认"
      options:
        - label: "我愿意让我的公开昵称与 GitHub 用户名出现在宣言署名册中，知道可再发 Issue 申请撤下"
          required: true
