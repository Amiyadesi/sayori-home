name: Verify and Deploy Sayori Home

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sayori-home-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.111.0
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require main for production events
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production verification and deploy must run from main."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout public content
        uses: actions/checkout@v6
        with:
          repository: Amiyadesi/sayori-articles
          ref: main
          path: content

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Record immutable deployment metadata
        shell: bash
        run: |
          echo "DEPLOYMENT_CODE_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "DEPLOYMENT_CONTENT_SHA=$(git -C content rev-parse HEAD)" >> "${GITHUB_ENV}"
          echo "DEPLOYMENT_BUILT_AT=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" >> "${GITHUB_ENV}"
          echo "DEPLOYMENT_WORKFLOW_RUN=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "${GITHUB_ENV}"

      - name: Sync public content
        env:
          CONTENT_DIR: ./content
        run: node scripts/sync-home-content.mjs

      - name: Run tests
        run: node --test scripts/*.test.mjs

      - name: Write deployment manifest
        run: node scripts/write-deployment-manifest.mjs public/deployment.json

      - name: Check production secrets
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Deploy Pages
        if: github.event_name != 'pull_request'
        run: >
          npm exec --yes --package="wrangler@${WRANGLER_VERSION}" -- wrangler pages deploy public
          --project-name sayori-home
          --branch main
          --commit-hash "${GITHUB_SHA}"
          --commit-message "Deploy sayori.org from GitHub Actions"

      - name: Verify custom domain
        if: github.event_name != 'pull_request'
        run: node scripts/verify-live-deployment.mjs https://sayori.org
