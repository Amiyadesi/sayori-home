name: Deploy Sayori Home

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

concurrency:
  group: sayori-home-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Amiyadesi/sayori-articles
          ref: main
          path: content
      - name: Check Cloudflare secrets
        id: cloudflare
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" || -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::warning::Cloudflare deploy skipped. Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets."
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "ready=true" >> "${GITHUB_OUTPUT}"
      - name: Sync public content
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CONTENT_DIR: ./content
        run: node scripts/sync-home-content.mjs
      - name: Deploy Pages
        if: steps.cloudflare.outputs.ready == 'true'
        run: >
          npx --yes wrangler@latest pages deploy public
          --project-name sayori-home
          --branch main
          --commit-message "Deploy sayori.org from GitHub Actions"
