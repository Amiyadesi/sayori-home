		<script>
			(() => {
				const key = "sayori:ui-language";
				const normalize = (value) => /^zh(?:-|_|$)/i.test(String(value || "")) ? "zh" : "en";
				let query = null;
				try {
					const url = new URL(window.location.href);
					const value = url.searchParams.get("lang");
					if (value === "zh" || value === "en") {
						query = value;
						url.searchParams.delete("lang");
						window.history.replaceState(null, "", `${url.pathname}${url.search}${url.hash}`);
						try { window.localStorage.setItem(key, value); } catch {}
					}
				} catch {}
				let stored = null;
				try {
					const value = window.localStorage.getItem(key);
					stored = value === "zh" || value === "en" ? value : null;
				} catch {}
				const language = query || stored || normalize(navigator.languages?.[0] || navigator.language || "zh");
				document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
				document.documentElement.dataset.sayoriCurrentLanguage = language;
				if (language === "en") document.documentElement.dataset.sayoriI18nPending = "true";
				window.SAYORI_I18N = { defaultLanguage: "zh", initialLanguage: language, pendingUntilReady: language === "en" };
			})();
		</script>

						<h2>关于 Amiya_desi</h2>
						<p>我是 Amiya_desi，一名以独立游戏为创作主线的开发者，也是一名学生；我主要使用 Godot 制作游戏，喜欢探索时间机制、多窗口交互和叙事体验；我也会制作网站、工具，并分享开发与学习中的经验</p>
						<h3>我的创作与实践</h3>
						<ul>
							<li>独立游戏开发：主要使用 Godot 和 GDScript，也有 C# 项目实践</li>
							<li>网站与工具：制作个人站、GeoScore 等 Web 工具</li>
							<li>建站与自托管：使用 Docker、VPS 和 Cloudflare 部署与维护个人服务</li>
							<li>内容与工作流：写文章、做视频、整理资源，也用 n8n 辅助内容整理与分发</li>
						</ul>
						<h3>项目与阶段成果</h3>
						<ul>
							<li><a href="https://amiya-desi.itch.io/delaytrace">DelayTrace</a>：围绕时间延迟、行动记录与回放的 Godot 小游戏，是我近期比较满意的一次 Jam 创作</li>
							<li><a href="https://amiya-desi.itch.io/time-rewind-linker">TimeRewindLinker</a>：时间回溯、动作回放与过去回声连接线的解谜实验</li>
							<li><a href="https://amiya-desi.itch.io/wake-up-at-the-border">梦醒边界</a>：融合解谜、对话与战斗的 Godot 游戏，获 GodotHub 第三届开发大赛命题 Jam 赛道二等奖</li>
							<li><a href="https://amiya-desi.itch.io/thatgamejam">Mio’s Window Wanderer</a>：我参与制作的多窗口叙事原型</li>
							<li><a href="https://geo.sayori.org/">GeoScore</a>：面向公开网页的 SEO / GEO 检查工具</li>
							<li><a href="https://github.com/Amiyadesi/enhance_save_system">Enhanced Save System</a>：提供 GDScript 与 C# 实现的 Godot 模块化存档插件</li>
						</ul>
						<h3>当前方向</h3>
