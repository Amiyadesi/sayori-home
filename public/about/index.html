		<script>
			(() => {
				const key = "sayori:ui-language";
				const normalize = (value) => /^zh(?:-|_|$)/i.test(String(value || "")) ? "zh" : "en";
				let query = null;
				try {
					const url = new URL(window.location.href);
					const value = url.searchParams.get("lang");
					if (value === "zh" || value === "en") {
						query = value;
						url.searchParams.delete("lang");
						window.history.replaceState(null, "", `${url.pathname}${url.search}${url.hash}`);
						try { window.localStorage.setItem(key, value); } catch {}
					}
				} catch {}
				let stored = null;
				try {
					const value = window.localStorage.getItem(key);
					stored = value === "zh" || value === "en" ? value : null;
				} catch {}
				const language = query || stored || normalize(navigator.languages?.[0] || navigator.language || "zh");
				document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
				document.documentElement.dataset.sayoriCurrentLanguage = language;
				if (language === "en") document.documentElement.dataset.sayoriI18nPending = "true";
				window.SAYORI_I18N = { defaultLanguage: "zh", initialLanguage: language, pendingUntilReady: language === "en" };
			})();
		</script>
