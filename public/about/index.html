				<noscript><article class="letter-noscript" aria-label="关于 Amiya_desi">
<h2>关于 Amiya_desi</h2>
<p>我是一名以 Godot 独立游戏为主线的开发者，喜欢时间机制、多窗口互动与叙事解谜；目前的主要目标是完成第一款 Steam 游戏。</p>
<h3>代表作品与阶段成果</h3>
<ul>
<li><a href="https://amiya-desi.itch.io/wake-up-at-the-border">梦醒边界</a>：解谜、对话与战斗交织，获 GodotHub 第三届命题 Jam 赛道二等奖。</li>
<li><a href="https://amiya-desi.itch.io/delaytrace">DelayTrace</a>：记录行动，让延迟的自己接着解谜。</li>
<li><a href="https://amiya-desi.itch.io/time-rewind-linker">TimeRewindLinker</a>：回放动作，用时间连线解谜。</li>
<li><a href="https://github.com/Amiyadesi/enhance_save_system">Enhanced Save System</a>：提供 GDScript 与 C# 实现的 Godot 存档插件。</li>
<li><a href="https://geo.sayori.org/">GeoScore</a>：检查网页 SEO / GEO 信号并定位可修问题。</li>
</ul>
<p>更多开发记录在<a href="https://blog.sayori.org/">博客</a>，代码在<a href="https://github.com/Amiyadesi">GitHub</a>，可玩作品在<a href="https://amiya-desi.itch.io/">itch.io</a>。</p>
</article></noscript>
