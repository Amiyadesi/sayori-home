				<noscript><article class="letter-noscript" aria-label="Amiya_desi について">
<h2>作品と節目</h2>
<p>これまでの各時期を代表する作品です。現在の状況はそれぞれの作品ページに載せています。</p>
<ul>
<li><a href="https://amiya-desi.itch.io/wake-up-at-the-border">WakeUpAtTheBorder</a>：謎解き、会話、戦闘を組み合わせた Godot ゲーム。第3回 GodotHub Jam のテーマ部門で2位になりました。詳しくは作品ページと<a href="https://legacy.godothub.com/festival/winners.html">受賞一覧</a>へ。</li>
<li><a href="https://amiya-desi.itch.io/delaytrace">DelayTrace</a>：行動を記録し、時間差で再生する Godot ゲーム。最近の Jam 作品の中でもお気に入りで、公開版を遊べます。</li>
<li><a href="https://amiya-desi.itch.io/time-rewind-linker">TimeRewindLinker</a>：時間を巻き戻し、過去の行動の残響をつないで解くパズル。</li>
<li><a href="https://github.com/Amiyadesi/enhance_save_system">Enhanced Save System</a>：GDScript と C# で実装した Godot 用のモジュール式セーブプラグイン。</li>
<li><a href="https://geo.sayori.org/">GeoScore</a>：公開ページの情報を確かめ、SEO・GEO のチェック結果と改善案を示すツールです。<a href="https://github.com/Amiyadesi/geoscore">ソースコード</a>も公開しています。</li>
<li><a href="https://amiya-desi.itch.io/thatgamejam">Mio's Window Wanderer</a>：制作に参加した物語のプロトタイプ。複数のウィンドウを行き来しながら会話を進めます。</li>
</ul>
<h3>連絡先とリンク</h3>
<ul>
<li><a href="https://blog.sayori.org/">ブログ</a>：開発や学習の記録、チュートリアル、振り返り。</li>
<li><a href="https://github.com/Amiyadesi">GitHub</a>：公開コードとオープンソースのプロジェクト。</li>
<li><a href="https://amiya-desi.itch.io/">itch.io</a>：小さなゲーム、Game Jam 作品、遊び方の実験。</li>
<li><a href="https://space.bilibili.com/3546919890585725">Bilibili</a>：動画、ゲーム作品、試行錯誤の記録。</li>
<li><a href="https://blog.sayori.org/guestbook/">ゲストブック</a>：提案や質問、ひとことのあいさつもどうぞ。</li>
<li><a href="https://blog.sayori.org/sponsor/">応援</a>：開発と運営を続けるための支援はこちら。</li>
</ul>
