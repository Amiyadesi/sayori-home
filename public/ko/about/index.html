				<noscript><article class="letter-noscript" aria-label="Amiya_desi 소개">
<h2>프로젝트와 이정표</h2>
<p>작업 시기마다 대표적인 프로젝트를 골랐습니다. 최신 상태는 각 프로젝트 페이지에 있습니다.</p>
<ul>
<li><a href="https://amiya-desi.itch.io/wake-up-at-the-border">WakeUpAtTheBorder</a>: 퍼즐과 대화, 전투를 결합한 Godot 게임입니다. 제3회 GodotHub Jam 테마 부문에서 2위를 차지했습니다. 프로젝트 페이지와 <a href="https://legacy.godothub.com/festival/winners.html">수상 목록</a>에서 자세히 볼 수 있습니다.</li>
<li><a href="https://amiya-desi.itch.io/delaytrace">DelayTrace</a>: 행동을 기록하고 시차를 두고 재생하는 Godot 게임입니다. 최근 잼 작품 중 특히 마음에 들며 공개 버전을 플레이할 수 있습니다.</li>
<li><a href="https://amiya-desi.itch.io/time-rewind-linker">TimeRewindLinker</a>: 시간을 되감아 행동을 재생하고 과거의 잔상을 잇는 퍼즐 실험.</li>
<li><a href="https://github.com/Amiyadesi/enhance_save_system">Enhanced Save System</a>: GDScript와 C#으로 구현한 Godot용 모듈형 저장 플러그인.</li>
<li><a href="https://geo.sayori.org/">GeoScore</a>: 공개 페이지의 근거를 바탕으로 SEO·GEO 점검 결과와 개선안을 보여 주는 도구입니다. <a href="https://github.com/Amiyadesi/geoscore">소스 코드</a>도 공개합니다.</li>
<li><a href="https://amiya-desi.itch.io/thatgamejam">Mio's Window Wanderer</a>: 창 사이를 이동하며 대화하는 방식을 실험한 내러티브 프로토타입으로, 제작에 참여했습니다.</li>
</ul>
<h3>연락처와 링크</h3>
<ul>
<li><a href="https://blog.sayori.org/">블로그</a>: 개발과 학습 기록, 튜토리얼, 회고.</li>
<li><a href="https://github.com/Amiyadesi">GitHub</a>: 공개 코드와 오픈 소스 프로젝트.</li>
<li><a href="https://amiya-desi.itch.io/">itch.io</a>: 작은 게임, 게임 잼 작품, 게임플레이 실험.</li>
<li><a href="https://space.bilibili.com/3546919890585725">Bilibili</a>: 영상, 게임 프로젝트, 이것저것 만들어 본 기록.</li>
<li><a href="https://blog.sayori.org/guestbook/">방명록</a>: 제안이나 질문, 짧은 인사를 남겨 주세요.</li>
<li><a href="https://blog.sayori.org/sponsor/">후원</a>: 개발과 유지 관리를 이어 가는 데 힘을 보태 주세요.</li>
</ul>
