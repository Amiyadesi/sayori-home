<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090b16" />
  <meta name="description" content="Subaru Tap - 菜月昴惨叫音阶应援器" />
  <link rel="icon" href="Image/subaru_cat.png" type="image/png" />
  <title>Subaru Tap / 死亡回归</title>
  <style>
    :root {
      --void: #090b16;
      --night: #11162a;
      --panel: rgba(18, 23, 43, .82);
      --panel-strong: rgba(11, 14, 28, .94);
      --ink: #f4f0ed;
      --muted: #a7a6b6;
      --line: rgba(244, 240, 237, .16);
      --scarlet: #ed596b;
      --ice: #86cfff;
      --violet: #a681e8;
      --gold: #e9c77f;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--ink);
      background: var(--void);
      font-family: "Arial Narrow", "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    button, a { font: inherit; }
    button { color: inherit; }
    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      background: var(--void);
    }
    #fx { position: absolute; inset: 0; z-index: 5; width: 100%; height: 100%; pointer-events: none; }
    #zoneflash { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
    .zone-flash {
      position: absolute;
      opacity: 0;
      mix-blend-mode: screen;
      animation: zone-fade .28s ease-out forwards;
    }
    header {
      position: absolute;
      z-index: 7;
      inset: 0 0 auto;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      padding: max(18px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) 0 max(22px, env(safe-area-inset-left));
      pointer-events: none;
    }
    .controls { display: flex; gap: 9px; pointer-events: auto; }
    .control {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: rgba(11, 14, 28, .72);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 18px;
      transition: transform .12s ease, background .12s ease, border-color .12s ease, color .12s ease;
    }
    .control:hover, .control:focus-visible { background: var(--scarlet); border-color: var(--scarlet); color: white; outline: none; }
    .control:active { transform: scale(.9); }
    .control.is-pulsed { animation: control-pulse .24s ease-out; }
    .control.is-muted { color: var(--muted); opacity: .58; }
    main { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; pointer-events: none; }
    .hero {
      position: relative;
      width: min(52vw, 520px);
      aspect-ratio: 1;
      min-width: 220px;
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    .hero::before, .hero::after { display: none; }
    .avatar-frame {
      --avatar-pulse: 1;
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: transparent;
      border: 0;
      outline: 0;
      box-shadow: none;
      transform: rotate(-2deg);
      scale: var(--avatar-pulse);
      animation: avatar-idle 10s linear infinite;
      transition: filter .16s ease, box-shadow .16s ease;
    }
    body:not(.is-live) .avatar-frame { animation: none; scale: 1; }
    .avatar-frame.is-hit .avatar { animation: avatar-hit .28s cubic-bezier(.2, 1.5, .4, 1); filter: saturate(1.35) contrast(1.12); }
    .avatar-frame.is-fall .avatar { animation: avatar-fall .54s cubic-bezier(.2, .85, .35, 1); filter: saturate(1.28) contrast(1.12); }
    .avatar-frame.is-squash .avatar { animation: avatar-squash .42s cubic-bezier(.2, 1.4, .4, 1); filter: saturate(1.18) contrast(1.08); }
    .avatar-frame.is-shake .avatar { animation: avatar-shake .34s ease-out; filter: saturate(1.4) contrast(1.16); }
    .avatar-frame.is-freeze .avatar { animation: avatar-freeze .48s ease-out; filter: saturate(.7) contrast(1.2) hue-rotate(14deg); }
    .avatar-frame.is-burst .avatar { animation: avatar-burst .38s cubic-bezier(.2, 1.5, .4, 1); filter: saturate(1.5) contrast(1.18); }
    .avatar-frame.is-void .avatar { animation: avatar-void .56s cubic-bezier(.2, .8, .3, 1); filter: saturate(.55) contrast(1.4) brightness(.72); }
    .corpse {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      pointer-events: none;
      animation: corpse-drop .72s cubic-bezier(.2, .78, .35, 1) forwards;
    }
    .corpse img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 6%;
      transform: scale(1.12);
      filter: grayscale(0) contrast(1.05) drop-shadow(0 16px 20px rgba(0, 0, 0, .4));
      animation: corpse-gray .72s ease-out forwards;
    }
    .avatar {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      padding: 6%;
      filter: drop-shadow(0 16px 20px rgba(0, 0, 0, .5));
    }
    body.is-live #avatar { transform: scale(1.12); transform-origin: 50% 62%; }
    #overlay {
      position: absolute;
      inset: 0;
      z-index: 9;
      display: grid;
      place-items: center;
      background: var(--void);
      transition: opacity .28s ease, visibility .28s ease;
    }
    #overlay.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .start-shell {
      width: min(430px, 66vw);
      display: grid;
      place-items: center;
    }
    .bmoe-link {
      margin-bottom: 12px;
      color: var(--ink);
      font-weight: 800;
      text-underline-offset: 5px;
    }
    .bmoe-link:hover, .bmoe-link:focus-visible { color: var(--scarlet); outline: none; }
    .entry-art { width: 100%; transform: rotate(-2deg); }
    .entry-art img { display: block; width: 100%; max-height: 68vh; object-fit: contain; filter: grayscale(1) contrast(1.08); }
    .start-button {
      min-width: 180px;
      margin-top: 18px;
      padding: 13px 22px;
      border: 1px solid rgba(244, 240, 237, .42);
      border-radius: 2px;
      color: var(--ink);
      background: var(--scarlet);
      box-shadow: 0 10px 24px rgba(0, 0, 0, .24);
      cursor: pointer;
      font-weight: 800;
      letter-spacing: .04em;
      transition: transform .12s ease, filter .12s ease;
    }
    .start-button:hover, .start-button:focus-visible { filter: brightness(1.12); outline: none; }
    .start-button:active { transform: scale(.94); }
    .start-button.is-loading { opacity: .68; cursor: wait; }
    .about-button {
      margin-top: 10px;
      padding: 8px 18px;
      border: 0;
      border-bottom: 1px dashed rgba(244, 240, 237, .48);
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      letter-spacing: .12em;
    }
    .about-button:hover, .about-button:focus-visible { color: var(--scarlet); outline: none; }
    .about-modal {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(9, 11, 22, .84);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .18s ease, visibility .18s ease;
    }
    .about-modal.is-open { opacity: 1; visibility: visible; pointer-events: auto; }
    .about-panel {
      position: relative;
      width: min(620px, 100%);
      padding: clamp(30px, 6vw, 62px);
      border: 1px solid rgba(244, 240, 237, .24);
      background: var(--night);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .42);
      text-align: left;
    }
    .about-panel h2 { margin: 0 0 28px; font-size: clamp(28px, 5vw, 44px); letter-spacing: .12em; }
    .about-panel p { margin: 18px 0; color: var(--muted); line-height: 1.7; }
    .about-panel a { color: var(--ink); text-underline-offset: 5px; }
    .about-panel a:hover, .about-panel a:focus-visible { color: var(--scarlet); outline: none; }
    .about-close {
      position: absolute;
      top: 14px;
      right: 16px;
      width: 42px;
      height: 42px;
      border: 0;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      font-size: 30px;
    }
    .about-close:hover, .about-close:focus-visible { color: var(--scarlet); outline: none; }
    @keyframes avatar-hit { 0% { transform: rotate(-2deg) scale(1); } 34% { transform: rotate(3deg) scale(1.16); } 100% { transform: rotate(-2deg) scale(1); } }
    @keyframes avatar-fall { 0% { transform: rotate(-2deg) scale(1); } 28% { transform: rotate(4deg) scale(1.12) translateY(-3%); } 100% { transform: rotate(86deg) scale(.82) translate(18%, 16%); } }
    @keyframes avatar-squash { 0% { transform: rotate(-2deg) scale(1); } 35% { transform: rotate(-1deg) scale(1.15, .72); } 100% { transform: rotate(-2deg) scale(1); } }
    @keyframes avatar-shake { 0%, 100% { transform: rotate(-2deg) scale(1); } 20% { transform: rotate(-8deg) scale(1.04); } 45% { transform: rotate(7deg) scale(1.08); } 70% { transform: rotate(-4deg) scale(1.03); } }
    @keyframes avatar-freeze { 0% { transform: rotate(-2deg) scale(1); } 28% { transform: rotate(-2deg) scale(1.12); } 52% { transform: rotate(-1deg) scale(.98); } 100% { transform: rotate(-2deg) scale(1); } }
    @keyframes avatar-burst { 0% { transform: rotate(-2deg) scale(1); } 32% { transform: rotate(2deg) scale(1.24); } 100% { transform: rotate(-2deg) scale(1); } }
    @keyframes avatar-void { 0% { transform: rotate(-2deg) scale(1); } 30% { transform: rotate(-2deg) scale(1.12); } 100% { transform: rotate(5deg) scale(.9); } }
    @keyframes corpse-drop { 0% { opacity: 1; transform: translate(0, 0) rotate(var(--corpse-start-rotate)) scale(1); } 12% { opacity: 1; transform: translate(var(--corpse-mid-x), var(--corpse-mid-y)) rotate(var(--corpse-mid-rotate)) scale(1.06); } 68% { opacity: 1; transform: translate(var(--corpse-x), var(--corpse-y)) rotate(var(--corpse-end-rotate)) scale(.72); } 100% { opacity: 0; transform: translate(var(--corpse-x), var(--corpse-y)) rotate(var(--corpse-end-rotate)) scale(.72); } }
    @keyframes corpse-gray { 0% { filter: grayscale(0) contrast(1.05) drop-shadow(0 16px 20px rgba(0, 0, 0, .4)); } 100% { filter: grayscale(1) brightness(.82) contrast(1.22) drop-shadow(0 16px 20px rgba(0, 0, 0, .18)); } }
    @keyframes avatar-idle { 0% { transform: rotate(-2deg) translateY(0); } 25% { transform: rotate(88deg) translateY(-2%); } 50% { transform: rotate(178deg) translateY(0); } 75% { transform: rotate(268deg) translateY(2%); } 100% { transform: rotate(358deg) translateY(0); } }
    @keyframes control-pulse { 0% { transform: scale(1); } 38% { transform: scale(1.14); } 100% { transform: scale(1); } }
    @keyframes zone-fade { 0% { opacity: .78; } 100% { opacity: 0; } }
    @media (max-width: 700px) {
      header { padding-left: 16px; padding-right: 16px; }
      .hero { width: min(82vw, 420px); }
      .start-shell { width: min(340px, 72vw); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } .avatar-frame { scale: 1 !important; } }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="fx" aria-hidden="true"></canvas>
    <div id="zoneflash" aria-hidden="true"></div>
    <header>
      <div class="controls" aria-label="播放控制">
        <button class="control" id="music-toggle" type="button" aria-label="关闭背景音乐" title="背景音乐">♪</button>
        <button class="control" id="sfx-toggle" type="button" aria-label="关闭音效" title="惨叫音效">◉</button>
      </div>
    </header>
    <main>
      <div class="hero" aria-hidden="true">
        <div class="avatar-frame" id="avatar-frame"><img class="avatar" id="avatar" src="Image/subaru_entry.png" alt="菜月昴黑白漫画图像" draggable="false" /></div>
      </div>
    </main>
    <div id="overlay" role="dialog" aria-modal="true" aria-label="点击开始">
      <div class="start-shell">
        <a class="bmoe-link" href="https://www.bilibili.com/video/BV15TuB6sENQ/" target="_blank" rel="noopener noreferrer">观看 B萌应援视频</a>
        <div class="entry-art"><img src="Image/subaru_entry.png" alt="菜月昴黑白漫画图像" draggable="false" /></div>
        <button class="start-button" id="start-button" type="button">开始游戏</button>
        <button class="about-button" id="about-button" type="button">关于</button>
      </div>
      <div class="about-modal" id="about-modal" aria-hidden="true">
        <section class="about-panel" role="dialog" aria-modal="true" aria-labelledby="about-title">
          <button class="about-close" id="about-close" type="button" aria-label="关闭关于">×</button>
          <h2 id="about-title">关于</h2>
          <p>作者：<a href="https://sayori.org" target="_blank" rel="noopener noreferrer">Amiya_desi</a></p>
          <p>灵感来源：<a href="https://github.com/MarkCup-Official/Dagou-Tap-New" target="_blank" rel="noopener noreferrer">大狗叫开源项目</a></p>
          <p>声音来源：<a href="https://www.bilibili.com/video/BV1n1qVY3EmT/?share_source=copy_web&amp;vd_source=ef9038113a12a31b9ec1aab42867bce1" target="_blank" rel="noopener noreferrer">【爱昴TV之惨叫总集篇】</a></p>
        </section>
      </div>
    </div>
  </div>
  <script src="audio-data.js?v=12"></script>
  <script src="main.js?v=12"></script>
</body>
</html>
