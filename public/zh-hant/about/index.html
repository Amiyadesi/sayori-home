				<noscript><article class="letter-noscript" aria-label="關於 Amiya_desi">
<h2>關於 Amiya_desi</h2>
<p>我是一名以 Godot 獨立遊戲為主線的開發者，喜歡時間機制、多視窗互動與敘事解謎；目前的主要目標是完成第一款 Steam 遊戲。</p>
<h3>代表作品與階段成果</h3>
<ul>
<li><a href="https://amiya-desi.itch.io/wake-up-at-the-border">夢醒邊界</a>：解謎、對話與戰鬥交織，獲 GodotHub 第三屆命題 Jam 賽道二等獎。</li>
<li><a href="https://amiya-desi.itch.io/delaytrace">DelayTrace</a>：記錄行動，讓延遲的自己接著解謎。</li>
<li><a href="https://amiya-desi.itch.io/time-rewind-linker">TimeRewindLinker</a>：回放動作，用時間連線解謎。</li>
<li><a href="https://github.com/Amiyadesi/enhance_save_system">Enhanced Save System</a>：提供 GDScript 與 C# 實作的 Godot 存檔外掛。</li>
<li><a href="https://geo.sayori.org/">GeoScore</a>：檢查網頁 SEO / GEO 訊號並定位可修正問題。</li>
</ul>
<p>更多開發記錄在<a href="https://blog.sayori.org/">部落格</a>，程式碼在<a href="https://github.com/Amiyadesi">GitHub</a>，可玩作品在<a href="https://amiya-desi.itch.io/">itch.io</a>。</p>
</article></noscript>
